# ══════════════════════════════════════════════════════════════
# astra-vcs-assist — Routing Table
# ══════════════════════════════════════════════════════════════
#
# Machine-readable (scripts/sync-routing.py writes this) AND
# human-readable (SKILL.md instructs the agent to read this).
#
# When adding a routable block:
#   1. Add a new entry under `routing:`
#   2. `skills:` names the macro skill (`astra-vcs-assist`); `path:` selects the block —
#      blocks under references/ are NOT registered skills, so a path is mandatory
#   3. `indicators:` lists semantic hints for agent classification
#
# Convention:
#   - skill: registered skill (always the macro); path: block inside its references/ tree
#   - indicators: semantic hints for agent classification

version: 1

routing:

  # ── GPG Key Management ───────────────────────────────────
  - type: gpg-key-management
    label: "GPG key management"
    indicators:
      - gpg key
      - signing key
      - import key
      - generate key
      - rotate key
      - gpg setup
      - gpg failed to sign
      - gpg-agent
      - passphrase cache
      - keygrip
      - gpg-preset-passphrase
    skills:
      - name: astra-vcs-assist
        path: references/gpg/key-lifecycle/SKILL.md
    principles: "Check existing keys first. Never hardcode passphrases. See gpg-key-lifecycle.md for algorithm choices."

  # ── Repository Init ───────────────────────────────────────
  - type: vcs-init
    label: "Repository initialisation"
    indicators:
      - init repo
      - new repository
      - bootstrap project
      - create project
      - start new project
      - initialise
      - first commit
      - git init
      - add licence
      - choose licence
      - gitignore
      - git config
      - credential helper
      - remote setup
      - add remote
    skills:
      - name: astra-vcs-assist
        path: references/git/init/SKILL.md
    principles: "Per-repo identity (not global). Verify GPG email match. LICENSE file must be standard text (no preamble)."

  # ── Daily Development Workflow ────────────────────────────
  - type: vcs-dev
    label: "Daily development workflow"
    indicators:
      - commit
      - stage
      - git add
      - stash
      - branch
      - merge
      - rebase
      - working on feature
      - in development
      - git status
      - git diff
      - partial stage
      - git add -p
      - wip
    skills:
      - name: astra-vcs-assist
        path: references/git/dev/SKILL.md
    principles: "One logical change per commit. Separate tasks, separate commits. `git pull --rebase` by default. Use `git add -p` for partial staging."

  # ── Release / Commit Cleanup ──────────────────────────────
  - type: vcs-release
    label: "Release & commit cleanup"
    indicators:
      - squash
      - rebase interactive
      - cleanup commits
      - tidy history
      - prepare release
      - tag version
      - semantic version
      - changelog
      - commit message
      - reword
      - split commit
      - amend
      - fixup
      - version bump
    skills:
      - name: astra-vcs-assist
        path: references/git/release/SKILL.md
    principles: "Never rebase pushed commits without force-push consent. Verify SemVer bump type before tagging."

  # ── Push / Sync / Transfer ────────────────────────────────
  - type: vcs-sync
    label: "Remote synchronisation"
    indicators:
      - push
      - force push
      - force-with-lease
      - dual remote
      - mirror
      - git bundle
      - cross-machine
      - transfer commits
      - push to remote
      - credential
      - pull
      - sync
      - push failed
      - rejected push
    skills:
      - name: astra-vcs-assist
        path: references/git/sync/SKILL.md
    principles: "Always `git fetch` before `--force-with-lease`. Tags are immutable once pushed. `GIT_TERMINAL_PROMPT=0` for headless pushes."

  # ── Fork / Upstream Adaptation ─────────────────────────────
  - type: vcs-fork
    label: "Fork & upstream adaptation"
    indicators:
      - fork
      - upstream
      - fork upstream
      - fork adaptation
      - copyright handling
      - fork licensing
      - open source fork
      - fork readme
      - astra fork
      - dual remote
    skills:
      - name: astra-vcs-assist
        path: references/git/fork/SKILL.md
    principles: "Keep upstream remote. Never push upstream branches. Copyright: append, never replace. Split infra changes from content changes."
  # ── Tower Model: Topology & Projection Decisions ─────────
  - type: vcs-topology-tower
    label: "Repo topology governance (tower & projections)"
    indicators:
      - fork governance
      - upstream rebase
      - dual remote strategy
      - multi remote topology
      - open source disclosure
      - sanitise public branch
      - upstream tracking branch
      - tower model
      - projection
      - default branch naming
    skills:
      - name: astra-vcs-assist
        reference: references/tower-model.md
    principles: "One linear tower (INFRA/ADAPT/PATCH/BASE); audiences get slice-projections, never parallel branches. Upstream projection = cherry-pick PATCH only; cross-trust-domain disclosure strips INFRA and sanitises ADAPT."

  # ── Repo Versioning & Dual-Branch Release ────────────────
  - type: vcs-versioning
    label: "Three-layer SemVer + dual-branch release (this repo)"
    indicators:
      - version scheme
      - three-layer version
      - semver suffix
      - dual-branch release
      - public branch
      - promotion
      - agent layer bump
    skills:
      - name: astra-vcs-assist
        path: references/versioning/layers/SKILL.md
    principles: "Layers are nested subsets (GitHub ⊂ Gitea ⊂ instance); content added upward, suffixes stripped downward. Release advances both remotes' main via PR."

  # ── Code Review Pipeline ──────────────────────────────────
  - type: vcs-review
    label: "Pre-commit code review"
    indicators:
      - review code
      - review my changes
      - code review
      - pre commit verification
      - verify code
      - verify changes
      - static security scan
      - security scan
      - quality gate
      - independent review
      - auto fix
      - fix issues
      - before commit
      - check before push
      - verify before commit
      - commit verification
      - pre commit check
    skills:
      - name: astra-vcs-assist
        path: references/git/review/SKILL.md
    principles: "Not a reviewer should verify its own work — fresh context finds what you miss. Auto-fix loop is limited to 2 cycles. Escalate to user after that."

  # ── GitHub Platform Operations ────────────────────────────
  - type: vcs-github
    label: "GitHub platform operations"
    indicators:
      - gh cli
      - gh auth
      - 提 PR
      - 开 issue
      - pull request review
      - GitHub Actions
      - re-run workflow
      - github release
      - repository secrets
      - branch protection api
      - fork a repository
    skills:
      - name: astra-vcs-assist
        path: references/github/platform/SKILL.md
    principles: "Resolve authentication before the first call (gh if authenticated, else GITHUB_TOKEN, else git-credentials) and derive owner/repo from the remote URL rather than hardcoding it. GitHub is the public projection: private topology never enters its issues, PRs or metadata."

  # ── Gitea / Forgejo Platform Operations ───────────────────
  - type: vcs-forge
    label: "Self-hosted forge operations (Gitea / Forgejo)"
    indicators:
      - gitea api
      - gitea pr
      - act_runner
      - gitea actions runner
      - forgejo
      - forgejo migration
      - 自建 git
      - gitea release
      - webhook management
      - object storage migration
      - protected branch api
    skills:
      - name: astra-vcs-assist
        path: references/forge/platform/SKILL.md
    principles: "Forgejo is a hard fork of Gitea whose REST API stays compatible, so one curl recipe serves both; the differences are deployment-level (workflow dirs, token env names, image and env prefixes). Private forge holds real topology — operate with a repository-scoped token, and reach the self-hosted cert with http.version=HTTP/1.1 on push."

  # ── Published-history rewriting ─────────────────────────
  - type: vcs-history
    label: "Published history rewriting and signing"
    indicators:
      - 重写历史
      - rebase 全部提交
      - filter-repo
      - 抹掉术语
      - unsigned commits
      - authorship unclear
      - squash before push
    skills:
      - name: astra-vcs-assist
        path: references/history/signing/SKILL.md
    principles: "Decide the disclosure level before touching history, not after: the clip is the plan. Verify signature and authorship of every commit that will become public, and never rewrite a pushed branch without the owner's explicit word."

  # ── GitHub credential lifecycle ─────────────────────────
  - type: github-pat
    label: "GitHub PAT lifecycle"
    indicators:
      - github token
      - PAT scope
      - rotate token
      - revoke token
      - fine-grained token
    skills:
      - name: astra-vcs-assist
        path: references/github/pat/SKILL.md
    principles: "Tokens are minted by a human in the web UI; an agent never accepts a token in chat and never widens a scope on its own."

  # ── GitHub dependency automation ────────────────────────
  - type: github-dependabot
    label: "Dependabot, auto-merge and PR-title gates"
    indicators:
      - dependabot
      - auto merge
      - pr title lint
      - npm audit
      - version bump pr
    skills:
      - name: astra-vcs-assist
        path: references/github/dependabot/SKILL.md
    principles: "Automation may open and merge PRs; the version label it may write is bounded by policy, and every auto-merge needs a green CI proof, not a green button."

  # ── Issue to verified PR ────────────────────────────────
  - type: github-issue-to-pr
    label: "Carry a GitHub issue to a verified PR"
    indicators:
      - 关掉这个 issue
      - issue to pr
      - 提 PR 关联 issue
      - closes #
    skills:
      - name: astra-vcs-assist
        path: references/github/issue-to-pr/SKILL.md
    principles: "The PR is not done until the CI state and the verification are reported honestly; no fabricated 'uploaded/written' claims."

  # ── Remote authentication diagnosis ─────────────────────
  - type: git-remote-auth
    label: "Remote authentication failures"
    indicators:
      - could not read Username
      - permission denied
      - auth fails
      - credential helper
      - token rejected
    skills:
      - name: astra-vcs-assist
        path: references/git/remote-auth/SKILL.md
    principles: "Establish which credential path the remote actually consulted before changing anything; never hand a token to a prompt on someone else's behalf."
  # ── Forge migration ─────────────────────────────────────
  - type: forge-migration
    label: "Gitea to Forgejo in-place migration"
    indicators:
      - gitea to forgejo
      - migration version newer
      - schema version error
      - act_runner setup
    skills:
      - name: astra-vcs-assist
        path: references/forge/migration/SKILL.md
    principles: "Migration is an INFRA event: back up the database, read the schema version before touching binaries, and never run it on a forge the fleet depends on without a restore path proven."
  # ── History rewriting (full procedure) ──────────────────
  - type: vcs-history-reorg
    label: "Rewrite published history end to end"
    indicators:
      - 重写整个历史
      - 清除历史中的术语
      - filter-repo 全流程
      - 历史里的凭据
      - purge from every commit
    skills:
      - name: astra-vcs-assist
        path: references/history/reorg/SKILL.md
    principles: "Decide the disclosure plan before the first rewrite commit; prove base equivalence; propagate to every clone and pin in the same pass."
  # ── Upstream contribution ───────────────────────────────
  - type: github-upstream
    label: "Carry a fix to an upstream repository"
    indicators:
      - 向上游提 PR
      - upstream contribution
      - fork a repo to fix upstream
      - contribution purity
    skills:
      - name: astra-vcs-assist
        path: references/github/upstream/SKILL.md
    principles: "An upstream PR describes the upstream bug and the fix only: no fleet devices, no orchestrator integration, no deployment environment. Private topology never reaches a public forge."
  # ── Seed from upstream ──────────────────────────────────
  - type: vcs-seed-from-upstream
    label: "Independent repo seeded from an upstream"
    indicators:
      - seed from upstream
      - 孤儿根
      - orphan root
      - 非 fork 派生
      - rename audit upstream
    skills:
      - name: astra-vcs-assist
        path: references/git/seed-from-upstream/SKILL.md
    principles: "An orphan root severs the graph, not the obligation: prune the upstream's baggage, strip reference chains, and audit the rename — an inherited name is a leak the compiler will not catch."
